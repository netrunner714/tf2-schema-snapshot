name: Daily schema snapshot

on:
  schedule:
    # 04:10 UTC — off-peak for Steam and for GitHub Actions load.
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish or retry npm even if schema content has not changed"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build snapshot
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          SNAPSHOT_LANGUAGES: ru
          SNAPSHOT_OUT_DIR: dist
        run: pnpm build:snapshot

      - name: Load previous release and detect changes
        id: diff
        run: |
          set -euo pipefail
          mkdir -p previous-snapshot
          if git fetch origin snapshot-release; then
            git archive FETCH_HEAD dist | tar -x -C previous-snapshot
          else
            echo "No previous snapshot-release branch; this is the first publication."
          fi

          PREV_HASH=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('previous-snapshot/dist/meta.json','utf8')).contentHash)}catch{console.log('')}")
          NEW_HASH=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/meta.json','utf8')).contentHash)")
          echo "prev-hash: ${PREV_HASH:-none}"
          echo "new-hash: $NEW_HASH"
          if [ -n "$PREV_HASH" ] && [ "$PREV_HASH" = "$NEW_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate human-readable and machine-readable changelog
        if: steps.diff.outputs.changed == 'true'
        run: pnpm exec tsx src/generate-changelog.ts previous-snapshot/dist dist "$GITHUB_SHA"

      - name: Prepare GitHub Release notes
        if: steps.diff.outputs.changed == 'true'
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("dist/changelog.json", "utf8"));
          const s = report.summary;
          const lines = [
            `## TF2 Schema Snapshot ${report.version}`,
            `Published: ${report.generatedAt.slice(0, 10)} UTC`,
            "",
            "### Summary",
            `- Items: +${s.addedItems} added, -${s.removedItems} removed, ${s.updatedItems} updated`,
            `- Fields: +${s.addedFields} added, -${s.removedFields} removed, ${s.changedFields} changed`,
            `- Localization changes: ${s.localizationChanges}`,
            `- Quality-label changes: ${s.qualityChanges}`,
            `- Metadata changes: ${s.metaChanges}`,
            "",
            "### Patch notes",
            ...(report.manualNotes.length ? report.manualNotes.flatMap(note => [note, ""]) : ["No manual notes for this release.", ""]),
            "### Automatic schema changes",
          ];
          const display = value => {
            const text = typeof value === "string" ? value : JSON.stringify(value);
            return text === undefined ? "undefined" : text.length > 100 ? text.slice(0, 97) + "…" : text;
          };
          if (!report.changes.length) lines.push("- No field-level differences were found.");
          else {
            for (const change of report.changes.slice(0, 30)) {
              let line = `- **${change.category}** — \`${change.path}\``;
              if (Object.hasOwn(change, "oldValue") || Object.hasOwn(change, "newValue")) {
                line += `: ${display(change.oldValue)} → ${display(change.newValue)}`;
              }
              lines.push(line);
            }
            if (report.changes.length > 30) {
              lines.push("", `Full diff: ${report.changes.length - 30} more changes are available in changelog.json.`);
            }
          }
          const categoryRu = {
            "item-added": "Предмет добавлен",
            "item-removed": "Предмет удалён",
            "field-added": "Поле добавлено",
            "field-removed": "Поле удалено",
            "field-changed": "Поле изменено",
            "localization-added": "Перевод добавлен",
            "localization-removed": "Перевод удалён",
            "localization-changed": "Перевод изменён",
            "quality-added": "Название качества добавлено",
            "quality-removed": "Название качества удалено",
            "quality-changed": "Название качества изменено",
            "meta-changed": "Метаданные снапшота изменены",
          };
          lines.push(
            "",
            "## Изменения на русском",
            "",
            `Опубликован новый снимок схемы Team Fortress 2 от ${report.generatedAt.slice(0, 10)} (UTC).`,
            "",
            "### Сводка",
            `- Предметы: +${s.addedItems} добавлено, -${s.removedItems} удалено, ${s.updatedItems} изменено`,
            `- Поля: +${s.addedFields} добавлено, -${s.removedFields} удалено, ${s.changedFields} изменено`,
            `- Изменения переводов: ${s.localizationChanges}`,
            `- Изменения названий качеств: ${s.qualityChanges}`,
            `- Изменения метаданных: ${s.metaChanges}`,
            "",
            "### Дополнительные заметки",
            ...(report.manualNotes.length ? report.manualNotes.flatMap(note => [note, ""]) : ["Для этого выпуска дополнительных заметок нет.", ""]),
            "### Автоматические изменения схемы",
          );
          if (!report.changes.length) lines.push("Изменений отдельных полей не обнаружено.");
          else {
            for (const change of report.changes.slice(0, 30)) {
              let line = `- **${categoryRu[change.category] ?? change.category}** — \`${change.path}\``;
              if (Object.hasOwn(change, "oldValue") || Object.hasOwn(change, "newValue")) {
                line += `: ${display(change.oldValue)} → ${display(change.newValue)}`;
              }
              lines.push(line);
            }
            if (report.changes.length > 30) {
              lines.push("", `Полный список: ещё ${report.changes.length - 30} изменений доступно в changelog.json.`);
            }
          }
          lines.push(
            "",
            "[Полная история изменений / Full changelog](https://github.com/netrunner714/tf2-schema-snapshot/blob/snapshot-release/dist/CHANGELOG.md) · [Машиночитаемый diff](https://github.com/netrunner714/tf2-schema-snapshot/blob/snapshot-release/dist/changelog.json)",
            `Исходный коммит: ${report.sourceCommit}`,
            ""
          );
          fs.writeFileSync(process.env.RUNNER_TEMP + "/release-notes.md", lines.join("\n"));
          NODE

      - name: Create or update GitHub Release
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)
          HASH=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/meta.json','utf8')).contentHash.slice(0,8))")
          TAG="schema-${DATE}-${HASH}"
          TITLE="TF2 Schema Snapshot — $(date -u +%Y-%m-%d)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi

      - name: Publish snapshot to the snapshot-release branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "snapshot-bot"
          git config user.email "actions@github.com"
          # Orphan branch holding only the artifacts — consumers fetch it by
          # ref, the source tree stays clean. dist/ is gitignored on main;
          # the release branch ignores nothing by design.
          git checkout --orphan snapshot-release
          git rm -rf --cached . >/dev/null
          rm -rf .github src test node_modules pnpm-lock.yaml tsconfig.json package.json .gitignore changes
          git add -f dist
          git commit -m "snapshot: $(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/meta.json','utf8')).version)")"
          git push origin snapshot-release --force

      - name: Publish npm package (optional)
        if: steps.diff.outputs.changed == 'true' || inputs.publish_npm == true
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          if [ -z "${NPM_PUBLISH_TOKEN:-}" ]; then
            echo "NPM_PUBLISH_TOKEN not set — skipping npm publish (snapshot-release branch is published)."
            exit 0
          fi
          set -euo pipefail
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/meta.json','utf8')).version.replace('v1-','').replace(/[^0-9a-zA-Z.-]/g,'-'))")
          DATE=$(date -u +%Y.%m.%d)
          PKG_VERSION="${DATE}-${VERSION}"
          cat > package.npm.json <<EOF
          {
            "name": "tf2-schema-snapshot",
            "version": "${PKG_VERSION}",
            "description": "Daily-build TF2 schema snapshot (items, icons, i18n, qualities) merged from items_game.txt and GetSchemaItems.",
            "type": "module",
            "license": "MIT",
            "files": ["dist"],
            "publishConfig": { "access": "public" }
          }
          EOF
          mkdir -p npm-pkg/dist
          cp -r dist/* npm-pkg/dist/
          cp package.npm.json npm-pkg/package.json
          cd npm-pkg
          npm config set //registry.npmjs.org/:_authToken "$NPM_PUBLISH_TOKEN"
          if npm view "tf2-schema-snapshot@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "tf2-schema-snapshot@${PKG_VERSION} is already published — skipping duplicate."
            exit 0
          fi
          npm publish --access public --tag latest
